# ============================================================
# netlify.toml — Sumit Ubale Photography
# Production-grade config: SEO + Performance + Security
# ============================================================

[build]
  publish = "."
  command = ""

# ============================================================
# SPA Routing — Prevent 404 on direct URL access
# (Must be LAST redirect, only for unknown paths)
# ============================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}
  force = false

# Individual page routes — serve HTML directly (avoids SPA rewrite)
[[redirects]]
  from = "/pages/:page"
  to = "/pages/:page"
  status = 200

# Force HTTPS
[[redirects]]
  from = "http://supf.in/*"
  to = "https://supf.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.supf.in/*"
  to = "https://supf.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.supf.in/*"
  to = "https://supf.in/:splat"
  status = 301
  force = true

# ============================================================
# Global Headers — Security + SEO + Performance
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Origins below are the ones the site actually loads: unpkg (GSAP + Lenis),
    # Google Fonts, Sirv + Cloudinary media, and FormSubmit for the contact form.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://exdevx.sirv.com https://*.sirv.com https://res.cloudinary.com; media-src 'self' https://exdevx.sirv.com https://*.sirv.com https://res.cloudinary.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://formsubmit.co; frame-ancestors 'none';"
    # Performance
    X-DNS-Prefetch-Control = "on"

# HTML pages — no caching (always fresh for SEO)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS files — long cache with versioning
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JavaScript files — long cache with versioning
[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images — long cache
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicons — medium cache
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# JSON data — moderate cache
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Sitemap — fresh weekly
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

# Robots — moderate cache
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
