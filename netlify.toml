# ============================================================
# netlify.toml — Sumit Ubale Photography
# Vite + React, prerendered to static HTML by vite-react-ssg.
# Production-grade config: SEO + Performance + Security
# ============================================================

[build]
  publish = "dist"
  command = "npm run build"

# ============================================================
# Redirects — single source of truth (the _redirects file was removed
# so host rules are not defined in two places).
#
# No SPA catch-all: every route is prerendered to its own index.html, and a
# "/*" -> "/index.html" rewrite would only mask genuine 404s.
# ============================================================

# --- Canonical host: force https + non-www --------------------------------
[[redirects]]
  from = "http://supf.in/*"
  to = "https://supf.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.supf.in/*"
  to = "https://supf.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.supf.in/*"
  to = "https://supf.in/:splat"
  status = 301
  force = true

# --- Old .html paths -> new routes ----------------------------------------
# These are indexed and carry backlinks. Query strings are preserved by
# Netlify, so /pages/gallery.html?category=haldi lands on /gallery?category=haldi.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/pages/gallery.html"
  to = "/gallery"
  status = 301

[[redirects]]
  from = "/pages/albums.html"
  to = "/albums"
  status = 301

[[redirects]]
  from = "/pages/portfolio.html"
  to = "/portfolio"
  status = 301

# The service template used ?service= (and ?s=) for the slug; those become
# path segments. The slug-less form goes to the flagship service.
[[redirects]]
  from = "/pages/service.html"
  query = { service = ":slug" }
  to = "/service/:slug"
  status = 301

[[redirects]]
  from = "/pages/service.html"
  query = { s = ":slug" }
  to = "/service/:slug"
  status = 301

[[redirects]]
  from = "/pages/service.html"
  to = "/service/weddings"
  status = 301

# --- SEO landing pages (highest sitemap priority) -------------------------
[[redirects]]
  from = "/pages/wedding-photographer-shrigonda.html"
  to = "/wedding-photographer-shrigonda"
  status = 301

[[redirects]]
  from = "/pages/pre-wedding-shoot-ahilyanagar.html"
  to = "/pre-wedding-shoot-ahilyanagar"
  status = 301

[[redirects]]
  from = "/pages/candid-photographer-maharashtra.html"
  to = "/candid-photographer-maharashtra"
  status = 301

[[redirects]]
  from = "/pages/cinematic-wedding-films-maharashtra.html"
  to = "/cinematic-wedding-films-maharashtra"
  status = 301

[[redirects]]
  from = "/pages/"
  to = "/portfolio"
  status = 301

[[redirects]]
  from = "/pages/*"
  to = "/"
  status = 301

# --- Vanity short URLs ----------------------------------------------------
# /portfolio, /gallery and /albums are real routes now, so they need no rule.
[[redirects]]
  from = "/services"
  to = "/service/weddings"
  status = 301

[[redirects]]
  from = "/shrigonda"
  to = "/wedding-photographer-shrigonda"
  status = 301

[[redirects]]
  from = "/prewedding"
  to = "/pre-wedding-shoot-ahilyanagar"
  status = 301

[[redirects]]
  from = "/candid"
  to = "/candid-photographer-maharashtra"
  status = 301

[[redirects]]
  from = "/films"
  to = "/cinematic-wedding-films-maharashtra"
  status = 301

# ============================================================
# Global Headers — Security + SEO + Performance
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Origins the site actually loads. GSAP and Lenis are bundled now, so the
    # unpkg allowance the static site needed is gone. 'unsafe-inline' stays:
    # the prerender emits two inline bootstrap scripts (__staticRouterHydrationData
    # and __VITE_REACT_SSG_HASH__) and blocking them breaks hydration.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://exdevx.sirv.com https://*.sirv.com https://res.cloudinary.com; media-src 'self' https://exdevx.sirv.com https://*.sirv.com https://res.cloudinary.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://formsubmit.co; frame-ancestors 'none';"
    # Performance
    X-DNS-Prefetch-Control = "on"

# HTML pages — no caching (always fresh for SEO)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build output — safe to cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images — long cache
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicons — medium cache
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# JSON data — moderate cache
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Sitemap — fresh weekly
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

# Robots — moderate cache
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Local fonts (if ever self-hosted)
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Web app manifest
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"
